name: Global candidate monitoring

on:
  schedule:
    - cron: "7 19 * * 1-5"
      timezone: "America/Toronto"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: global-candidate-monitoring
  cancel-in-progress: false

jobs:
  forecast-and-monitor-global-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install production dependencies
        run: uv sync --locked --no-dev

      - name: Download checksum-pinned global candidate
        run: uv run python -m scripts.download_global_candidate_model

      - name: Refresh all 35 series, forecast, and monitor
        run: uv run python -m scripts.run_global_monitoring --refresh

      - name: Add global report to workflow summary
        if: always()
        run: |
          if [ -f global-monitoring-output/report.md ]; then
            cat global-monitoring-output/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload global prediction and monitoring artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-monitoring-${{ github.run_id }}
          path: global-monitoring-output/
          if-no-files-found: warn
          retention-days: 90
