name: Daily monitoring

on:
  # Temporary branch trigger for pre-merge end-to-end validation. Remove after
  # the first green run; scheduled workflows execute only from the default branch.
  push:
    branches: [phase-5-ci]
    paths:
      - ".github/workflows/monitoring.yml"
      - "configs/monitoring.yaml"
      - "monitoring/**"
      - "src/monitoring/**"
      - "scripts/download_production_model.py"
      - "scripts/run_monitoring.py"
  schedule:
    - cron: "37 18 * * 1-5"
      timezone: "America/Toronto"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-monitoring
  cancel-in-progress: false

jobs:
  forecast-and-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install production dependencies
        run: uv sync --locked --no-dev

      - name: Download checksum-pinned production model
        run: uv run python -m scripts.download_production_model

      - name: Refresh data, forecast, and monitor
        run: uv run python -m scripts.run_monitoring

      - name: Add report to workflow summary
        if: always()
        run: |
          if [ -f monitoring-output/report.md ]; then
            cat monitoring-output/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload prediction and monitoring artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monitoring-${{ github.run_id }}
          path: monitoring-output/
          if-no-files-found: warn
          retention-days: 90
