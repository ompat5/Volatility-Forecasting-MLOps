name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Create deterministic global CI model fixture
        run: uv run python -m scripts.create_ci_global_model

      - name: Export deterministic global FP32 ONNX fixture
        run: |
          uv run python -m scripts.export_global_onnx \
            --artifact-dir .ci-global-model

      - name: Build CI validation image
        run: |
          docker build \
            --build-arg MODEL_DIR=.ci-global-model \
            --build-arg MODEL_VARIANT=global-ci-fixture \
            --tag volatility-forecaster:ci \
            .

      - name: Smoke-test global MLflow container
        run: |
          docker run --detach \
            --name volatility-forecaster-ci-global \
            --publish 8000:8000 \
            volatility-forecaster:ci
          uv run python -m scripts.smoke_test_api
          docker rm --force volatility-forecaster-ci-global

      - name: Smoke-test global ONNX container
        run: |
          docker run --detach \
            --name volatility-forecaster-ci-global-onnx \
            --env MODEL_BACKEND=onnx \
            --publish 8000:8000 \
            volatility-forecaster:ci
          uv run python -m scripts.smoke_test_api

      - name: Show container logs after failure
        if: failure()
        run: |
          docker logs volatility-forecaster-ci-global || true
          docker logs volatility-forecaster-ci-global-onnx || true

      - name: Stop container
        if: always()
        run: |
          docker rm --force volatility-forecaster-ci-global || true
          docker rm --force volatility-forecaster-ci-global-onnx || true
