[project]
name = "volatility-forecasting-mlops"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arch>=8.0.0",
    "fastapi>=0.138.1",
    "mlflow>=3.14.0",
    "numpy>=1.26,<2",
    "onnx>=1.22.0",
    "onnxruntime<1.20",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14.6",
    "streamlit>=1.58.0",
    "torch<2.3",
    "uvicorn>=0.49.0",
    "yfinance>=1.5.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

# Use the CPU-only torch wheels on Linux (the Docker image) to avoid pulling ~2GB of
# unused CUDA libraries. The marker leaves macOS local dev on its default (CPU/MPS) torch.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
# Notebooks are exploratory; reusable production logic belongs in src/ and is linted.
extend-exclude = ["notebooks"]
